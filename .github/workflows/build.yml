name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build (${{ matrix.rid }})
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Refresh MAC vendor database
        shell: pwsh
        run: ./build/update-vendors.ps1

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = "0.0.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Publish (warnings are errors)
        shell: pwsh
        run: >
          dotnet publish src/Wific/Wific.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -warnaserror
          -o out

      - name: Rename binary
        shell: pwsh
        run: Move-Item out/wific.exe "out/wific-${{ matrix.rid }}.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: wific-${{ matrix.rid }}
          path: out/wific-${{ matrix.rid }}.exe
          if-no-files-found: error

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem dist/*.exe).FullName
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --title "WiFic $env:GITHUB_REF_NAME" --generate-notes
